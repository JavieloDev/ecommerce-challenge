<!-- ===== PRODUCT CARD ===== -->
<div
  class="group flex h-full flex-col rounded-xl border border-emerald-100/50 bg-white/80 backdrop-blur-sm shadow-sm transition-all duration-300 hover:shadow-xl hover:shadow-emerald-500/10 hover:border-emerald-200/70 overflow-hidden">

  <!-- ===== PRODUCT IMAGE ===== -->
  <div class="relative aspect-square w-full overflow-hidden bg-gradient-to-br from-emerald-50/50 to-teal-50/30">
    @if (product().imageUrl && !imageError()) {
      <img
        [src]="product().imageUrl"
        [alt]="product().name"
        (error)="onImageError()"
        class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
        loading="lazy"
      />
    } @else {
      <!-- Fallback Placeholder -->
      <div class="flex h-full w-full items-center justify-center">
        <svg class="h-16 w-16 text-emerald-200/60" fill="none" viewBox="0 0 24 24" stroke="currentColor"
             stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3 8.25V18a2.25 2.25 0 002.25 2.25h13.5A2.25 2.25 0 0021 18V8.25m-18 0V6a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 6v2.25m-18 0h18" />
        </svg>
      </div>
    }

    <!-- Stock badge -->
    @if (product().stock === 0) {
      <div class="absolute inset-0 flex items-center justify-center bg-black/40 backdrop-blur-sm">
        <span class="rounded-full bg-red-500/90 px-4 py-1.5 text-sm font-bold text-white shadow-lg">Agotado</span>
      </div>
    }
  </div>
  <!-- ===== END: PRODUCT IMAGE ===== -->

  <!-- ===== PRODUCT CONTENT ===== -->
  <div class="flex flex-1 flex-col p-4">

    <!-- Product name -->
    <h3 class="text-sm font-semibold text-slate-800 line-clamp-2 min-h-[2.5rem]">
      {{ product().name }}
    </h3>

    <!-- Product description -->
    <p class="mt-1 text-xs text-slate-400 line-clamp-2 min-h-[2rem]">
      {{ product().description | truncate: 30 }}
    </p>

    <!-- ===== PRICE & STOCK ===== -->
    <div class="mt-3 flex items-end justify-between border-t border-emerald-50 pt-3">
      <div>
        <span class="text-lg font-bold text-emerald-700">
          {{ product().price | currency }}
        </span>
        @if (product().stock > 0) {
          <span class="ml-2 text-[10px] font-medium text-emerald-400">
            · {{ product().stock }} uds.
          </span>
        }
      </div>
    </div>
    <!-- ===== END: PRICE & STOCK ===== -->

    <!-- ===== ADD TO CART BUTTON ===== -->
    <button
      (click)="onAddToCart()"
      [disabled]="product().stock === 0"
      class="mt-3 w-full rounded-lg bg-gradient-to-r from-emerald-500 to-teal-500 py-2.5 text-sm font-semibold text-white shadow-sm shadow-emerald-500/20 transition-all duration-300 hover:shadow-md hover:shadow-emerald-500/30 hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:hover:shadow-none"
    >
      @if (product().stock === 0) {
        <span class="flex items-center justify-center gap-2">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
          Sin stock
        </span>
      } @else {
        <span class="flex items-center justify-center gap-2">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Agregar
        </span>
      }
    </button>
    <!-- ===== END: ADD TO CART BUTTON ===== -->

  </div>
  <!-- ===== END: PRODUCT CONTENT ===== -->

</div>
<!-- ===== END: PRODUCT CARD ===== -->
